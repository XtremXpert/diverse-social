# Jitsi Meet Docker Compose
# Self-hosted video conferencing for Odoo social_calling module
# Loi 25 compliant: data stays on your infrastructure

version: '3.8'

services:
  # Web server (Nginx + Jitsi Meet web)
  web:
    image: jitsi/web:stable-9364
    restart: unless-stopped
    ports:
      - '${HTTP_PORT}:80'
      - '${HTTPS_PORT}:443'
    volumes:
      - ${CONFIG}/web:/config:Z
      - ${CONFIG}/web/crontabs:/var/spool/cron/crontabs:Z
      - ${CONFIG}/transcripts:/usr/share/jitsi-meet/transcripts:Z
    environment:
      - ENABLE_COLIBRI_WEBSOCKET
      - ENABLE_LETSENCRYPT
      - ENABLE_NO_AUDIO_DETECTION
      - ENABLE_P2P
      - ENABLE_PREJOIN_PAGE
      - ENABLE_WELCOME_PAGE
      - ENABLE_CLOSE_PAGE
      - DISABLE_POLLS
      - ENABLE_LIVESTREAMING=0
      - ENABLE_RECORDING=0
      - ETHERPAD_URL_BASE
      - PUBLIC_URL=https://${JITSI_DOMAIN}
      - JITSI_IMAGE_TYPE=stable
      - LETSENCRYPT_DOMAIN
      - LETSENCRYPT_EMAIL
      - LETSENCRYPT_USE_STAGING
      - NGINX_WORKER_PROCESSES
      - NGINX_WORKER_CONNECTIONS
      - PEOPLE_SEARCH_URL
      - RESOLVER_ADDRESS
      - START_WITH_AUDIO_MUTED
      - START_WITH_VIDEO_MUTED
      - TESTING_CAP_SCREENSHARE_ENTITY
      - TESTING_OCTO_PROBABILITY
      - TOKEN_AUTH_URL
      - VIDEOQUALITY_BITRATE_H264_LOW
      - VIDEOQUALITY_BITRATE_H264_STANDARD
      - VIDEOQUALITY_BITRATE_H264_HIGH
      - VIDEOQUALITY_BITRATE_H264_FULLHD
      - VIDEOQUALITY_BITRATE_H264_ULTRAHD
      - VIDEOQUALITY_BITRATE_VP8_LOW
      - VIDEOQUALITY_BITRATE_VP8_STANDARD
      - VIDEOQUALITY_BITRATE_VP8_HIGH
      - VIDEOQUALITY_BITRATE_VP8_FULLHD
      - VIDEOQUALITY_BITRATE_VP8_ULTRAHD
      - VIDEOQUALITY_BITRATE_VP9_LOW
      - VIDEOQUALITY_BITRATE_VP9_STANDARD
      - VIDEOQUALITY_BITRATE_VP9_HIGH
      - VIDEOQUALITY_BITRATE_VP9_FULLHD
      - VIDEOQUALITY_BITRATE_VP9_ULTRAHD
      - XMPP_DOMAIN
      - XMPP_AUTH_DOMAIN
      - XMPP_GUEST_DOMAIN
      - XMPP_MUC_DOMAIN
      - XMPP_INTERNAL_MUC_DOMAIN
      - XMPP_BOSH_URL_BASE
      - XMPP_SOCKET_MODE
      - XMPP_RECORDER_DOMAIN
      - XMPP_PORT
      - JICOFO_AUTH_USER
      - LETSENCRYPT_ACME_DIR
    networks:
      - meet.jitsi

  # XMPP server (Prosody)
  prosody:
    image: jitsi/prosody:stable-9364
    restart: unless-stopped
    expose:
      - '5222'
      - '5347'
      - '5280'
    volumes:
      - ${CONFIG}/prosody:/config:Z
      - ${CONFIG}/prosody/prosody-plugins-custom:/usr/share/jitsi-meet/prosody-plugins-custom:Z
    environment:
      - AUTH_TYPE
      - ENABLE_AUTH
      - ENABLE_GUESTS
      - ENABLE_LOBBY
      - ENABLE_XMPP_WEBSOCKET
      - GLOBAL_CONFIG
      - GLOBAL_MODULES
      - LDAP_URL
      - LDAP_BASE
      - LDAP_BINDDN
      - LDAP_BINDPW
      - LDAP_FILTER
      - LDAP_AUTH_METHOD
      - LDAP_VERSION
      - LDAP_USE_TLS
      - LDAP_TLS_CIPHERS
      - LDAP_TLS_CHECK_PEER
      - LDAP_TLS_CACERT_FILE
      - LDAP_TLS_CACERT_DIR
      - LDAP_START_TLS
      - XMPP_DOMAIN
      - XMPP_AUTH_DOMAIN
      - XMPP_GUEST_DOMAIN
      - XMPP_MUC_DOMAIN
      - XMPP_INTERNAL_MUC_DOMAIN
      - XMPP_MODULES
      - XMPP_MUC_MODULES
      - XMPP_INTERNAL_MUC_MODULES
      - XMPP_RECORDER_DOMAIN
      - XMPP_PORT
      - JIBRI_BREWERY_MUC
      - JIBRI_PENDING_TIMEOUT
      - JIBRI_XMPP_USER
      - JIBRI_XMPP_PASSWORD
      - JIBRI_RECORDER_USER
      - JIBRI_RECORDER_PASSWORD
      - JWT_APP_ID
      - JWT_APP_SECRET
      - JWT_ACCEPTED_ISSUERS
      - JWT_ACCEPTED_AUDIENCES
      - JWT_ASAP_KEYSERVER
      - JWT_ALLOW_EMPTY
      - JWT_AUTH_TYPE
      - JWT_TOKEN_AUTH_MODULE
      - LOG_LEVEL
      - MATRIX_UVS_URL
      - MATRIX_UVS_ISSUER
      - MATRIX_UVS_AUTH_TOKEN
      - MATRIX_UVS_SYNC_POWER_LEVELS
      - PUBLIC_URL
      - TURNS_HOST
      - TURNS_PORT
      - TZ
      - VIDEOBRIDGE_MAX_PARTICIPANTS
      - VIDEOBRIDGE_MAX_CONFERENCES
      - VIDEOBRIDGE_MAX_VIDEO_STREAMS
      - VIDEOBRIDGE_MAX_RECEIVERS_PER_VIDEO_STREAM
    networks:
      - meet.jitsi

  # Jicofo (focus component)
  jicofo:
    image: jitsi/jicofo:stable-9364
    restart: unless-stopped
    volumes:
      - ${CONFIG}/jicofo:/config:Z
    environment:
      - AUTH_TYPE
      - ENABLE_AUTH
      - XMPP_DOMAIN
      - XMPP_AUTH_DOMAIN
      - XMPP_MUC_DOMAIN
      - XMPP_INTERNAL_MUC_DOMAIN
      - XMPP_SERVER
      - XMPP_PORT
      - XMPP_RECORDER_DOMAIN
      - JICOFO_AUTH_USER
      - JICOFO_AUTH_PASSWORD
      - JICOFO_ENABLE_AUTH
      - JICOFO_ENABLE_HEALTH_CHECKS
      - JIBRI_BREWERY_MUC
      - JIBRI_PENDING_TIMEOUT
      - JIBRI_REQUEST_RETRIES
      - JICOFO_RESERVATION_REST_BASE_URL
      - JICOFO_ENABLE_PROMETHEUS_STATS
      - JICOFO_PROMETHEUS_HTTP_PORT
      - TZ
    depends_on:
      - prosody
    networks:
      - meet.jitsi

  # JVB (Video Bridge)
  jvb:
    image: jitsi/jvb:stable-9364
    restart: unless-stopped
    ports:
      - '${JVB_COLIBRI_PORT}:9090'
      - '${JVB_TCP_PORT}:${JVB_TCP_MAPPED_PORT}'
      - '${JVB_UDP_PORT}:${JVB_UDP_PORT}/udp'
    volumes:
      - ${CONFIG}/jvb:/config:Z
    environment:
      - ENABLE_COLIBRI_WEBSOCKET
      - ENABLE_XMPP_WEBSOCKET
      - DOCKER_HOST_ADDRESS
      - XMPP_AUTH_DOMAIN
      - XMPP_INTERNAL_MUC_DOMAIN
      - XMPP_SERVER
      - XMPP_PORT
      - XMPP_DOMAIN
      - PUBLIC_URL
      - JVB_AUTH_USER
      - JVB_AUTH_PASSWORD
      - JVB_BREWERY_MUC
      - JVB_PORT
      - JVB_TCP_HARVESTER_DISABLED
      - JVB_TCP_PORT
      - JVB_TCP_MAPPED_PORT
      - JVB_STUN_SERVERS
      - JVB_ENABLE_APIS
      - JVB_WS_DOMAIN
      - JVB_WS_SERVER_ID
      - JVB_WS_TLS
      - JVB_MUC_NICKNAME
      - COLIBRI_REST_ENABLED
      - COLIBRI_REST_PORT
      - TZ
      - VIDEOBRIDGE_MAX_PARTICIPANTS
      - VIDEOBRIDGE_MAX_CONFERENCES
      - VIDEOBRIDGE_MAX_VIDEO_STREAMS
      - VIDEOBRIDGE_MAX_RECEIVERS_PER_VIDEO_STREAM
    depends_on:
      - prosody
    networks:
      - meet.jitsi
      - jvb-net

networks:
  meet.jitsi:
    external: true
  jvb-net:
    driver: bridge
