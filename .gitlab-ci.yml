variables:
  ODOO_VERSION: 19.0
  ALLOWED_BRANCHES: 19.0
  COMMUNITY: true

include:
  - project: 'bemade/odoo-ci'
    ref: 'main'
    file: 'odoo-ci-dind.yaml'

# bemade/social is an OCA-style library: modules at the repo root, no
# addons/ wrapper. It's consumed via git submodule by every leaf
# (diverse-odoo, city-club, orage-club) — no standalone Docker image
# is meaningful for a library, so the inherited build/test/deploy
# jobs are disabled.
build:
  rules:
    - when: never
test:
  rules:
    - when: never
deploy:
  rules:
    - when: never
upgrade-modules:
  rules:
    - when: never
